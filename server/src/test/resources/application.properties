# Classroom Insight — Test Configuration
spring.application.name=classroom-insight-server-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.jackson.deserialization.fail-on-unknown-properties=true

classroominsight.ml.service-url=http://localhost:8000
classroominsight.ml.connect-timeout-ms=2000
classroominsight.ml.read-timeout-ms=5000

management.endpoints.web.exposure.include=health
