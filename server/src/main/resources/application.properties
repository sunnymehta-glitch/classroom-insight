# Classroom Insight — Spring Boot Application Configuration
server.port=8080
spring.application.name=classroom-insight-server

# File-backed H2 Database Configuration
# Managed strictly and exclusively by Spring Boot
spring.datasource.url=jdbc:h2:file:./data/h2/classroom_insight;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration - Strict schema enforcement (disallows G3, extra fields)
spring.jackson.deserialization.fail-on-unknown-properties=true

# H2 Console (Disabled in production, convenient for local debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Upstream FastAPI ML Service Connection
classroominsight.ml.service-url=${ML_SERVICE_URL:http://localhost:8000}
classroominsight.ml.connect-timeout-ms=${ML_SERVICE_CONNECT_TIMEOUT_MS:3000}
classroominsight.ml.read-timeout-ms=${ML_SERVICE_TIMEOUT_MS:5000}

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration (Overridable via CORS_ALLOWED_ORIGINS in production)
classroominsight.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Tomcat Thread Pool Tuning (bounded for memory conservation in constrained environments)
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:10}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:2}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:50}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:10}


